<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Downloader — off-catalogue sourcing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #0a0a0b;
        --panel: #121316;
        --card: #191a1f;
        --line: #282a31;
        --ink: #ececec;
        --ink-dim: #9a9aa2;
        --signal: #1ed760;
        --signal-soft: rgba(30, 215, 96, 0.14);
        --tape: #e7b24c;
        --tape-soft: rgba(231, 178, 76, 0.12);
        --display: "Space Grotesk", system-ui, sans-serif;
        --body: "Hanken Grotesk", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--body);
        font-size: 15px;
        line-height: 1.55;
        color: var(--ink);
        background:
          radial-gradient(120% 60% at 50% -10%, rgba(30, 215, 96, 0.06), transparent 60%),
          var(--void);
        display: flex;
        justify-content: center;
      }
      ::selection { background: var(--signal-soft); }
      :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; border-radius: 6px; }

      #app { display: contents; }
      .console {
        width: min(760px, 100%);
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      /* ---- Header / transport bar ---- */
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 22px 16px;
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; flex-direction: column; gap: 3px; }
      .brand-eyebrow {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.22em;
        color: var(--ink-dim);
      }
      .brand-word {
        font-family: var(--display);
        font-weight: 700;
        font-size: 19px;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .disc {
        width: 13px; height: 13px; border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, var(--void) 0 22%, var(--signal) 24% 60%, var(--void) 62% 70%, var(--signal) 72%);
        flex: none;
      }
      .readout {
        display: inline-flex; align-items: center; gap: 8px;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.16em;
        color: var(--ink-dim);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 12px 5px 10px;
        white-space: nowrap;
      }
      .readout i {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--ink-dim); flex: none;
      }
      .readout.sourcing i, .readout.downloading i { background: var(--signal); animation: blip 1.3s ease-in-out infinite; }
      .readout.sourcing, .readout.downloading { color: var(--ink); border-color: rgba(30,215,96,.35); }
      .readout.awaiting i { background: var(--tape); }
      .readout.awaiting { color: var(--tape); border-color: rgba(231,178,76,.4); }
      .readout.filed i { background: var(--signal); }
      .readout.filed { color: var(--signal); border-color: rgba(30,215,96,.45); }

      /* ---- Transcript ---- */
      .scroll {
        flex: 1;
        overflow-y: auto;
        padding: 24px 22px 8px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }
      .scroll::-webkit-scrollbar { width: 8px; }
      .scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

      .turn { animation: rise 0.26s ease both; }

      /* user request */
      .said { display: flex; justify-content: flex-end; }
      .said-bubble {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px 16px 4px 16px;
        padding: 10px 15px;
        max-width: 78%;
        font-weight: 500;
      }

      /* ---- Signature: signal-chain run card ---- */
      .rail { display: flex; flex-direction: column; padding-left: 2px; }
      .stage { position: relative; display: flex; align-items: center; gap: 13px; padding: 7px 0; }
      .stage:not(:last-child)::before {
        content: "";
        position: absolute;
        left: 6px; top: 22px; bottom: -8px;
        width: 2px;
        background: var(--line);
      }
      .stage.done:not(:last-child)::before { background: var(--signal); }
      .node {
        width: 14px; height: 14px; border-radius: 50%;
        border: 2px solid var(--line);
        background: var(--panel);
        flex: none; z-index: 1;
        transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      }
      .stage.done .node { background: var(--signal); border-color: var(--signal); }
      .stage.active .node {
        border-color: var(--signal);
        background: var(--void);
        box-shadow: 0 0 0 5px var(--signal-soft);
        animation: pulse 1.5s ease-in-out infinite;
      }
      .slabel { font-size: 14.5px; color: var(--ink-dim); transition: color 0.3s ease; }
      .stage.active .slabel { color: var(--ink); font-weight: 500; }
      .stage.done .slabel { color: var(--ink); }
      .stage.active .slabel::after {
        content: "";
        display: inline-block;
        width: 3px; height: 3px; margin-left: 7px; border-radius: 50%;
        background: var(--signal); vertical-align: middle;
        animation: blip 1s steps(1) infinite;
      }

      /* ---- Candidate picks ---- */
      .picks { display: flex; flex-direction: column; gap: 10px; }
      .picks-head {
        font-family: var(--mono);
        font-size: 10.5px; letter-spacing: 0.22em; color: var(--ink-dim);
        display: flex; align-items: center; gap: 10px;
      }
      .picks-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }
      .pick {
        display: flex; align-items: center; gap: 14px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 13px 14px;
        transition: border-color 0.2s ease, transform 0.2s ease;
      }
      .pick:hover { border-color: rgba(30,215,96,.4); }
      .pick-thumb-link { flex: none; display: block; line-height: 0; }
      .pick-thumb {
        width: 72px; height: 54px; border-radius: 8px;
        object-fit: cover; background: var(--line); display: block;
      }
      .pick-thumb-ph {
        display: flex; align-items: center; justify-content: center;
        font-family: var(--mono); font-size: 18px; color: var(--ink-dim);
      }
      .pick-thumb-ph::before { content: "\266A"; } /* musical note placeholder */
      .pick-main { flex: 1; min-width: 0; }
      .pick-title {
        display: block; font-weight: 600; font-size: 14.5px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        color: inherit; text-decoration: none;
      }
      .pick-title:hover { color: var(--signal); }
      .pick-meta { display: flex; align-items: center; gap: 9px; margin: 5px 0 9px; flex-wrap: wrap; }
      .pick-meta .mono { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); }
      .badge {
        font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em;
        padding: 2px 7px; border-radius: 5px;
        background: rgba(255,255,255,.05); color: var(--ink-dim);
        border: 1px solid var(--line);
      }
      .badge.pl { color: var(--tape); border-color: rgba(231,178,76,.4); background: var(--tape-soft); }
      .meter { display: flex; align-items: center; gap: 10px; }
      .meter-track { flex: 1; height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
      .meter-fill { display: block; height: 100%; background: var(--signal); border-radius: 999px; transition: width 0.7s cubic-bezier(.2,.7,.2,1); }
      .meter-val { font-family: var(--mono); font-size: 11.5px; color: var(--signal); min-width: 30px; text-align: right; }
      .cue {
        flex: none;
        background: var(--signal); color: #05210f;
        font-family: var(--body); font-weight: 600; font-size: 13.5px;
        border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer;
        transition: transform 0.12s ease, filter 0.12s ease;
      }
      .cue:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.08); }
      .cue:disabled { opacity: 0.4; cursor: not-allowed; }

      /* ---- Filed / completion ---- */
      .filed {
        display: flex; gap: 14px; align-items: flex-start;
        background: linear-gradient(180deg, rgba(30,215,96,.08), transparent), var(--card);
        border: 1px solid rgba(30,215,96,.35);
        border-radius: 14px; padding: 15px 16px;
      }
      .filed-tick {
        width: 30px; height: 30px; border-radius: 50%; flex: none;
        background: var(--signal); color: #05210f;
        display: grid; place-items: center; font-weight: 700; font-size: 16px;
      }
      .filed-head { font-family: var(--display); font-weight: 600; font-size: 16px; }
      .filed-sub { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); margin-top: 3px; }
      .filed-rel { margin-top: 7px; font-size: 13.5px; color: var(--ink); }

      /* ---- Notes (warn / empty result) ---- */
      .note {
        border: 1px solid rgba(231,178,76,.35);
        background: var(--tape-soft);
        border-radius: 14px; padding: 13px 15px;
      }
      .note-tag {
        font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em;
        color: var(--tape);
      }
      .note p { margin: 6px 0 0; color: var(--ink); }

      /* ---- Empty state ---- */
      .empty { margin: auto 0; padding: 8px 4px 24px; max-width: 540px; }
      .empty-h {
        font-family: var(--display); font-weight: 600;
        font-size: clamp(28px, 5vw, 40px); line-height: 1.05;
        letter-spacing: -0.02em; margin: 14px 0 12px;
      }
      .empty-h em { color: var(--signal); font-style: normal; }
      .empty-p { color: var(--ink-dim); font-size: 15.5px; max-width: 460px; margin: 0 0 22px; }
      .chips { display: flex; flex-wrap: wrap; gap: 9px; }
      .chip {
        font-family: var(--mono); font-size: 12px;
        background: var(--card); color: var(--ink-dim);
        border: 1px solid var(--line); border-radius: 999px;
        padding: 8px 14px; cursor: pointer;
        transition: color 0.15s ease, border-color 0.15s ease;
      }
      .chip:hover { color: var(--ink); border-color: rgba(30,215,96,.4); }

      /* ---- Composer ---- */
      .composer {
        display: flex; align-items: center; gap: 12px;
        padding: 16px 22px 22px;
        border-top: 1px solid var(--line);
      }
      .composer input {
        flex: 1;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink);
        padding: 13px 18px;
        font-family: var(--body); font-size: 15px;
      }
      .composer input::placeholder { color: var(--ink-dim); }
      .composer input:focus { border-color: rgba(30,215,96,.5); outline: none; }
      .send {
        width: 46px; height: 46px; flex: none;
        border: 0; border-radius: 50%;
        background: var(--signal); color: #05210f; cursor: pointer;
        display: grid; place-items: center;
        transition: transform 0.12s ease, filter 0.12s ease;
      }
      .send:hover:not(:disabled) { transform: scale(1.06); filter: brightness(1.08); }
      .send:disabled { opacity: 0.4; cursor: not-allowed; }
      .send svg { width: 18px; height: 18px; margin-left: 2px; }

      @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
      @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 5px var(--signal-soft); } 50% { box-shadow: 0 0 0 8px rgba(30,215,96,0.05); } }
      @keyframes blip { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

      @media (max-width: 600px) {
        .bar { padding: 14px 16px; }
        .brand-eyebrow { display: none; }
        .scroll, .composer { padding-left: 16px; padding-right: 16px; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      import { h, render } from "https://esm.sh/preact@10.23.2";
      import { useState, useRef, useCallback } from "https://esm.sh/preact@10.23.2/hooks";
      import htm from "https://esm.sh/htm@3.1.1";

      const html = htm.bind(h);

      // The pipeline is an ordered sequence; each run renders as a signal chain
      // whose stages light up as node-level `status` events stream in.
      const START_STAGES = () => [
        { key: "parse_request", label: "Parsing your request", state: "active" },
        { key: "search_candidates", label: "Searching off-catalogue sources", state: "pending" },
        { key: "evaluate_candidates", label: "Scoring candidates", state: "pending" },
        { key: "__await", label: "Awaiting your pick", state: "pending" },
      ];
      const RESUME_STAGES = () => [
        { key: "candidate_review", label: "Source cued", state: "active" },
        { key: "download", label: "Downloading audio", state: "pending" },
        { key: "inject_metadata", label: "Tagging & artwork from Discogs", state: "pending" },
      ];

      const READOUT = {
        idle: "IDLE",
        sourcing: "SOURCING",
        awaiting: "AWAITING PICK",
        downloading: "DOWNLOADING",
        filed: "FILED",
      };

      const EXAMPLES = [
        "Boards of Canada — Twoism",
        "DJ Screw — June 27th (compilation)",
        "a playlist of city pop b-sides",
      ];

      const fmtDuration = (s) => {
        s = Math.round(s || 0);
        const m = Math.floor(s / 60);
        return `${m}:${String(s % 60).padStart(2, "0")}`;
      };

      const fmtViews = (n) => {
        n = Math.max(0, Math.round(n || 0));
        if (n >= 1e9) return `${(n / 1e9).toFixed(1).replace(/\.0$/, "")}B`;
        if (n >= 1e6) return `${(n / 1e6).toFixed(1).replace(/\.0$/, "")}M`;
        if (n >= 1e3) return `${(n / 1e3).toFixed(1).replace(/\.0$/, "")}K`;
        return String(n);
      };

      // Advance a stage list: the completed node and everything before it become
      // done, and the next pending stage becomes active.
      function advance(stages, key) {
        const idx = stages.findIndex((s) => s.key === key);
        if (idx < 0) return stages;
        return stages.map((s, k) => {
          if (k <= idx) return s.state === "done" ? s : { ...s, state: "done" };
          if (k === idx + 1 && s.state === "pending") return { ...s, state: "active" };
          return s;
        });
      }

      // Minimal SSE reader over a fetch() ReadableStream. Yields parsed event
      // objects ({type, ...}) as "data:" frames arrive (frames split by \n\n).
      async function* readSSE(response) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let sep;
          while ((sep = buffer.indexOf("\n\n")) !== -1) {
            const frame = buffer.slice(0, sep);
            buffer = buffer.slice(sep + 2);
            const line = frame.split("\n").find((l) => l.startsWith("data:"));
            if (line) yield JSON.parse(line.slice(5).trim());
          }
        }
      }

      function App() {
        const [messages, setMessages] = useState([]);
        const [input, setInput] = useState("");
        const [busy, setBusy] = useState(false);
        const [phase, setPhase] = useState("idle");
        const scrollRef = useRef(null);
        const idRef = useRef(0);
        const runIdRef = useRef(null);

        const scrollSoon = useCallback(() => {
          queueMicrotask(() => {
            const el = scrollRef.current;
            if (el) el.scrollTop = el.scrollHeight;
          });
        }, []);

        const pushMsg = useCallback((msg) => {
          setMessages((prev) => [...prev, { id: ++idRef.current, ...msg }]);
          scrollSoon();
        }, [scrollSoon]);

        const beginRun = useCallback((stages) => {
          const id = ++idRef.current;
          setMessages((prev) => [...prev, { id, kind: "run", stages }]);
          runIdRef.current = id;
          scrollSoon();
        }, [scrollSoon]);

        const updateRun = useCallback((updater) => {
          const id = runIdRef.current;
          setMessages((prev) => prev.map((m) => (m.id === id ? updater(m) : m)));
          scrollSoon();
        }, [scrollSoon]);

        // Drive one SSE stream (start or resume) and route each event to the UI.
        async function consume(response) {
          for await (const event of readSSE(response)) {
            if (event.type === "status") {
              updateRun((m) => ({ ...m, stages: advance(m.stages, event.node) }));
            } else if (event.type === "interrupt") {
              if (event.interrupt_type === "candidate_review") {
                setPhase("awaiting");
                updateRun((m) => ({
                  ...m,
                  stages: m.stages.map((s) =>
                    s.key === "__await" ? { ...s, state: "active" } : { ...s, state: "done" }
                  ),
                }));
                pushMsg({
                  kind: "picks",
                  thread_id: event.payload.thread_id,
                  candidates: event.payload.candidates || [],
                });
              } else {
                updateRun((m) => ({ ...m, stages: m.stages.map((s) => ({ ...s, state: "done" })) }));
                pushMsg({
                  kind: "note",
                  tag: "UNSUPPORTED STEP",
                  text: `The "${event.interrupt_type}" step isn't supported in this UI yet. The run is paused safely — nothing was lost.`,
                });
              }
            } else if (event.type === "done") {
              updateRun((m) => ({ ...m, stages: m.stages.map((s) => ({ ...s, state: "done" })) }));
              const dr = event.payload.download_result;
              if (dr) {
                setPhase("filed");
                pushMsg({ kind: "filed", result: dr, release: event.payload.release });
              } else {
                setPhase("idle");
                pushMsg({
                  kind: "note",
                  tag: "NO MATCH",
                  text: "No source cleared the confidence bar. Try a more specific request — add the artist, year, or paste a link.",
                });
              }
            }
          }
        }

        async function startRun(request) {
          setBusy(true);
          setPhase("sourcing");
          beginRun(START_STAGES());
          try {
            const response = await fetch("/download/stream", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ request }),
            });
            await consume(response);
          } catch (err) {
            setPhase("idle");
            pushMsg({ kind: "note", tag: "CONNECTION LOST", text: `Couldn't reach the agent: ${err.message}` });
          } finally {
            setBusy(false);
          }
        }

        async function selectCandidate(threadId, url) {
          setBusy(true);
          setPhase("downloading");
          beginRun(RESUME_STAGES());
          try {
            const response = await fetch("/resume/stream", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ thread_id: threadId, selected_candidate_url: url }),
            });
            await consume(response);
          } catch (err) {
            setPhase("idle");
            pushMsg({ kind: "note", tag: "CONNECTION LOST", text: `Couldn't reach the agent: ${err.message}` });
          } finally {
            setBusy(false);
          }
        }

        function submit(text) {
          const request = (text ?? "").trim();
          if (!request || busy) return;
          pushMsg({ kind: "said", text: request });
          setInput("");
          startRun(request);
        }

        const renderTurn = (msg) => {
          if (msg.kind === "said") {
            return html`<div class="turn said" key=${msg.id}>
              <div class="said-bubble">${msg.text}</div>
            </div>`;
          }
          if (msg.kind === "run") {
            return html`<div class="turn rail" key=${msg.id}>
              ${msg.stages.map(
                (s, j) => html`<div class="stage ${s.state}" key=${j}>
                  <span class="node"></span><span class="slabel">${s.label}</span>
                </div>`
              )}
            </div>`;
          }
          if (msg.kind === "picks") {
            return html`<div class="turn picks" key=${msg.id}>
              <div class="picks-head">PICK A SOURCE</div>
              ${msg.candidates.map((c, j) => {
                const pct = Math.round((c.confidence_score ?? 0) * 100);
                return html`<div class="pick" key=${j}>
                  <a class="pick-thumb-link" href=${c.url} target="_blank" rel="noopener noreferrer">
                    ${c.thumbnail_url
                      ? html`<img class="pick-thumb" src=${c.thumbnail_url} alt="" loading="lazy"
                          onError=${(e) => { e.target.classList.add("pick-thumb-ph"); e.target.removeAttribute("src"); }} />`
                      : html`<div class="pick-thumb pick-thumb-ph"></div>`}
                  </a>
                  <div class="pick-main">
                    <a class="pick-title" href=${c.url} target="_blank" rel="noopener noreferrer">${c.title}</a>
                    <div class="pick-meta">
                      <span class="badge ${c.is_playlist ? "pl" : ""}">
                        ${c.is_playlist ? "PLAYLIST" : "VIDEO"}
                      </span>
                      <span class="mono">${c.channel_name}</span>
                      <span class="mono">${fmtDuration(c.duration_seconds)}</span>
                      <span class="mono">${fmtViews(c.view_count)} views</span>
                    </div>
                    <div class="meter">
                      <span class="meter-track"><span class="meter-fill" style=${`width:${pct}%`}></span></span>
                      <span class="meter-val">${(c.confidence_score ?? 0).toFixed(2)}</span>
                    </div>
                  </div>
                  <button class="cue" disabled=${busy} onClick=${() => selectCandidate(msg.thread_id, c.url)}>
                    Use this source
                  </button>
                </div>`;
              })}
            </div>`;
          }
          if (msg.kind === "filed") {
            const dr = msg.result;
            const rel = msg.release;
            return html`<div class="turn filed" key=${msg.id}>
              <div class="filed-tick">✓</div>
              <div>
                <div class="filed-head">Filed to your library</div>
                <div class="filed-sub">${dr.downloaded_count} downloaded · ${dr.skipped_count} skipped</div>
                ${rel
                  ? html`<div class="filed-rel">${rel.album_title} · ${rel.year} · ${rel.artist}</div>`
                  : null}
              </div>
            </div>`;
          }
          // note (warn / empty / error)
          return html`<div class="turn note" key=${msg.id}>
            <span class="note-tag">${msg.tag}</span>
            <p>${msg.text}</p>
          </div>`;
        };

        return html`
          <div class="console">
            <div class="bar">
              <div class="brand">
                <span class="brand-eyebrow">OFF-CATALOGUE · LOCAL FILES</span>
                <span class="brand-word"><span class="disc"></span>Music Downloader</span>
              </div>
              <span class="readout ${phase}"><i></i>${READOUT[phase]}</span>
            </div>

            <div class="scroll" ref=${scrollRef}>
              ${messages.length === 0
                ? html`<div class="empty">
                    <h1 class="empty-h">What are we <em>digging</em> for?</h1>
                    <p class="empty-p">
                      Find the records Spotify doesn't carry. I'll source the audio,
                      tag it from Discogs, and file it into your Local Files.
                    </p>
                    <div class="chips">
                      ${EXAMPLES.map(
                        (x, j) => html`<button class="chip" key=${j} onClick=${() => submit(x)}>${x}</button>`
                      )}
                    </div>
                  </div>`
                : messages.map(renderTurn)}
            </div>

            <form
              class="composer"
              onSubmit=${(e) => {
                e.preventDefault();
                submit(input);
              }}
            >
              <input
                type="text"
                placeholder="Name a record, a track, or paste a link"
                value=${input}
                disabled=${busy}
                onInput=${(e) => setInput(e.target.value)}
              />
              <button class="send" type="submit" disabled=${busy} aria-label="Start sourcing">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M5 3.5v17a1 1 0 0 0 1.5.87l14-8.5a1 1 0 0 0 0-1.74l-14-8.5A1 1 0 0 0 5 3.5z" />
                </svg>
              </button>
            </form>
          </div>
        `;
      }

      render(html`<${App} />`, document.getElementById("app"));
    </script>
  </body>
</html>
