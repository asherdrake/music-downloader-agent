[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "music-downloader-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.2",
    "yt-dlp>=2024.1",
    "mutagen>=1.47",
    "rapidfuzz>=3.9",
    "pyautogui>=0.9",
    "keyboard>=0.13",
    "httpx>=0.27",
    "spotipy>=2.24",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
openai   = ["langchain-openai>=0.2"]
google   = ["langchain-google-genai>=2.0"]
all-llms = ["langchain-openai>=0.2", "langchain-google-genai>=2.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "black>=24.4",
    "isort>=5.13",
    "flake8>=7.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
